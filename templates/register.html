<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard — Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body><div class="bg-grid"></div><div class="login-page"><div class="login-card">
  <div class="login-logo-name">PhishGuard AI</div>
  <div class="login-sub">Create User Account</div>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash flash-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
  <form method="POST">
    <div class="form-field"><label class="form-lbl">Username</label><input class="form-inp" name="username" minlength="3" maxlength="30" required></div>
    <div class="form-field"><label class="form-lbl">Email</label><input class="form-inp" type="email" name="email" required autocomplete="email"></div>
    <div class="form-field"><label class="form-lbl">Password</label><input class="form-inp" type="password" name="password" minlength="8" required autocomplete="new-password"></div>
    <div class="form-field"><label class="form-lbl">Confirm Password</label><input class="form-inp" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></div>
    <button class="form-btn" type="submit">Create Account →</button>
  </form>
  <div class="login-links"><a href="{{ url_for('user_login') }}">Already registered? Login</a></div>
</div></div></body></html>
