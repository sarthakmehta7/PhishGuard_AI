<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishGuard — Verify</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body><div class="bg-grid"></div><div class="login-page"><div class="login-card">
  <div class="login-logo-name">PhishGuard AI</div>
  <div class="login-sub">Development Verification</div>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash flash-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
  <p class="otp-help">Use the one-time development code below. It expires in 10 minutes.</p>
  <div class="dev-otp">{{ development_otp }}</div>
  <form method="POST"><div class="form-field"><label class="form-lbl">Six-Digit OTP</label><input class="form-inp otp-input" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></div><button class="form-btn" type="submit">Verify and Open Scanner →</button></form>
  <div class="login-links"><a href="{{ url_for('user_login') }}">Start again</a></div>
</div></div></body></html>
